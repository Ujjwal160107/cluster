apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  annotations:
    # N3 (P7): `websecure` only. `web` was declared but could never match — `router.tls: "true"` makes
    # Traefik build only a TLS router, so a plaintext request on :80 gets 404. Measured before this
    # change (direct to the origin, correct Host header, 2026-09-29): `HTTP/1.1 404 Not Found`. The edit
    # is therefore behaviour-neutral today and removes a declaration that contradicts `tls: "true"`.
    # It matters because grafana.upayan.dev is now behind Cloudflare Access (verified: 302 to the Access
    # login), and Access is only meaningful while nothing else can serve the same hostname.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  # S7: no `tls:` block. Traefik terminates with its default certificate (the
  # Cloudflare Origin CA wildcard via the TLSStore in k8s/platform/traefik/,
  # whose SAN covers *.upayan.dev). Removing this block also stops
  # cert-manager's ingress-shim creating the `Certificate/grafana-tls` it used
  # to own, which is what makes cert-manager removable -- this was its last
  # user.
  rules:
    - host: grafana.upayan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
