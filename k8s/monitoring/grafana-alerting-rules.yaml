  - uid: vps-backup-classa-stale
    title: VPS backup (class A) has not succeeded in over an hour
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: (time() - vps_backup_last_success_timestamp{class="A"}) > 2700
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
        refId: C
    for: 10m
    # No data is itself a failure here: the metric only exists while a backup has succeeded since
    # the last node-exporter restart, so a vanished series means backups are not running — unlike
    # the other rules, where silence is normal. Added 2026-09-28 with the vps-backup timers.
    noDataState: Alerting
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: 'No successful class-A backup (vcap-staging Postgres+MinIO) for over 45 minutes (three missed 15-minute runs); Check `systemctl status vps-backup-classA` and `journalctl -u vps-backup-classA` on the node.'
  - uid: vps-backup-classc-stale
    title: VPS backup (class C) has not succeeded in over 36 hours
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: (time() - vps_backup_last_success_timestamp{class="C"}) > 93600
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
