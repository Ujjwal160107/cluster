    # the other rules, where silence is normal. Added 2026-09-28 with the vps-backup timers.
    noDataState: Alerting
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'No successful class-C backup (bitvault, vcap-dev, rankstack, grafana) in 26h; the timer runs daily. Check `systemctl status vps-backup-classC` on the node.'
  - uid: vps-restic-check-stale
