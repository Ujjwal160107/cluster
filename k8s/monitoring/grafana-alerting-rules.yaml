  - uid: pod-image-pull-failing
    title: A pod cannot pull its container image
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        # ImagePullBackOff/CreateContainerConfigError are invisible today: nothing alerts on them, and
        # on 2026-09-28 the audit that produced this rule found vcap's worker image absent from the
        # node cache *and* unpullable - a KEDA scale-from-zero component that will simply fail the
        # next time it scales up. This is the rule that would have said so.
        expr: |
          max by (namespace, pod, reason) (
            kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError"}
          ) > 0
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
        refId: C
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image ({{ $labels.reason }}) for 10m — check the registry credentials and whether the image still exists.'

