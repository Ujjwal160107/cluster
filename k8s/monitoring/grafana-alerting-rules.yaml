        refId: B
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
        refId: C
    for: 15m
    # No data is a failure for these too: each metric only exists while its job has succeeded since
    # the last node-exporter restart, so a missing series means it is not running (added 2026-09-28
    # with the restic-check, restore-drill and etcd-offsite jobs).
    noDataState: Alerting
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'The weekly `restic check` (+10% data read) has not succeeded in 10 days, so repository corruption would now go unnoticed until a restore is attempted. Run `systemctl start vps-restic-check.service` and read `journalctl -u vps-restic-check` on the node.'
  - uid: vps-restore-test-stale
