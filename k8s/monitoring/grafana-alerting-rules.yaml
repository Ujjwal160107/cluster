    labels:
      severity: critical
    annotations:
      summary: 'The 12h etcd snapshot/offsite push has not succeeded in 36h. Losing etcd means losing all cluster state, and the k3s token/TLS in the same snapshot is what makes a restore possible. Check `journalctl -u vps-etcd-snapshot` on the node.'
  - uid: vps-backup-offsite-stale
    title: VPS backup offsite copy (R2) has not succeeded in over 4 hours
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: (time() - vps_backup_offsite_last_success_timestamp) > 14400
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
        refId: C
    for: 15m
    # No data is a failure here too, like the other backup staleness rules — and today it is *the*
    # state: the offsite leg (DR-001) is deployed but not enabled, because the R2 S3 credentials do not
    # exist yet, so the script is a deliberate no-op that writes no series at all. Firing is the honest
    # reading of that — "there is no offsite copy" is true, and it is the gap CLAUDE.md and
    # docs/disaster-recovery.md already record ("backups do not survive losing the node"). It goes
    # quiet with the first successful copy; enabling it is documented in ansible/roles/backup/README.md.
    # Severity is warning rather than critical for the same reason the integrity-check and drill rules
    # are: the local repository still holds every snapshot, so a stale offsite copy widens the
    # disaster-recovery window rather than losing data now — the critical rules are the ones whose
    # failure means the only copy stops being written.
        # `NoData: OK` here, deliberately, unlike the other staleness rules above. This series only exists
    # once a copy has SUCCEEDED, and the role's README has the operator prove one manual run before
    # enabling the timer — so "no series" means "not set up yet", not "broken". With the other rules'
    # `Alerting` this would fire from the moment it syncs until the R2 credentials arrive, which is an
    # alert nobody can resolve; a known-firing alert is one people learn to ignore. Once the leg is
    # enabled, a *stale* series still fires, which is the case DR-001 actually wants caught.
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'The hourly offsite copy of the backup repository to Cloudflare R2 has not succeeded in 4 hours (or has never run — the leg is credential-gated and writes no metric until it is enabled). Until it does, the only copy of the backups is on the node itself, so losing the node loses them. Check `systemctl status vps-backup-offsite` and `journalctl -u vps-backup-offsite` on the node; enablement is in ansible/roles/backup/README.md.'
  - uid: loki-ingestion-stopped
