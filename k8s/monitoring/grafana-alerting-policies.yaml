apiVersion: 1
policies:
  - orgId: 1
    receiver: discord
    group_by:
      - alertname
      - namespace
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: discord
        object_matchers:
          - ["severity", "=", "info"]
        group_interval: 15m
        repeat_interval: 12h
