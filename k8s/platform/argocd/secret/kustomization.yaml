apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
# argocd-secret (admin.password, admin.passwordMtime, server.secretkey) held in
# git, SOPS-encrypted. The chart's own creation of this Secret is disabled
# (`configs.secret.createSecret: false` in ../values.yaml) so there is exactly
# one owner. The values were copied from the live Secret and verified
# byte-identical after the switch, so the admin password cannot have changed.
generators:
  - secret-generator.yaml
