#
# P8-03: the SSH credential argocd-image-updater uses for its git write-back.
#
# Why a second credential rather than the PAT in `argocd/git-creds`: required status checks apply to
# pushes and the updater pushes to `main` on its own. The PAT authenticates as the owner, so making it
# bypass would also let every manual push bypass — the distinction the owner asked to keep. A deploy key
# is a distinct identity, so it can be the only bypass actor on ruleset 24126436.
#
# The matching public key is a write deploy key on this repository (id 164843318). The private half lives
# only here, SOPS-encrypted, consumed by this pod.
#
# `insecure: "false"` enables strict host-key verification; the chart already mounts
# `argocd-ssh-known-hosts-cm` at /app/config/ssh (verified on the running pod) and it carries
# github.com's keys. Without the field the updater skips host verification entirely.
apiVersion: v1
kind: Secret
metadata:
    name: git-creds-updater
    namespace: argocd
type: Opaque
stringData:
