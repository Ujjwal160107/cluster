apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  name: argocd
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: "7.9.1" # pinned: was floating "7.*"; this is the version already running live (2026-09-28)
      helm:
        valueFiles:
          - $values/k8s/platform/argocd/values.yaml
    - repoURL: https://github.com/upayanmazumder/vps
      targetRevision: main
      ref: values
    # S11: the ArgoCD component NetworkPolicies were live but untracked
    # leftovers from an older chart version. Kept here so git is the source
    # of truth for the control plane's network policy -- see
    # k8s/platform/argocd/network-policies/manifests.yaml for why the chart's
    # own `global.networkPolicy.create` templates are not used instead.
    - repoURL: https://github.com/upayanmazumder/vps
      targetRevision: main
      path: k8s/platform/argocd/network-policies
    # S11: argocd-secret (admin password hash + server.secretkey) now lives in
    # git SOPS-encrypted, so it survives an etcd loss. The chart's own creation
    # of it is disabled in ../values.yaml.
    - repoURL: https://github.com/upayanmazumder/vps
      targetRevision: main
      path: k8s/platform/argocd/secret
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
