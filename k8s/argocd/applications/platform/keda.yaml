apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  name: keda
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: "2.21.0" # pinned: was floating "2.*"; this is the version already running live (2026-09-28)
      helm:
        valueFiles:
          - $values/k8s/platform/keda/values.yaml
    - repoURL: https://github.com/upayanmazumder/vps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
