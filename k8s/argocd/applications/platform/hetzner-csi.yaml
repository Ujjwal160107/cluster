apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  name: hetzner-csi
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/upayanmazumder/vps
    targetRevision: main
    path: k8s/hetzner-csi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # Manual sync — already running; sync manually after review
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
