# S11 hardening: default-deny ingress for the namespace, plus per-component
# allow rules.
#
#   bitvaultd (8080)     <- Traefik (api-bitvault.upayan.dev) + same namespace
#   bitvaultd (9090/9091) <- same namespace only (grpc/metrics Service ports;
#                            nothing outside this namespace reaches them --
#                            the only Ingress backend here is 8080)
#   minio (9000/9001)    <- same namespace only
#   postgres (5432)      <- same namespace only
#
# None of the datastore Services are NodePort/LoadBalancer or routed by
# Traefik, so same-namespace-only is the correct restriction for all three.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bitvault-default-deny-ingress
  namespace: bitvault
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bitvaultd-ingress
  namespace: bitvault
spec:
  podSelector:
    matchLabels:
      app: bitvaultd
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9091
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bitvault-minio-ingress
  namespace: bitvault
spec:
  podSelector:
    matchLabels:
      app: bitvault-minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bitvault-postgres-ingress
  namespace: bitvault
spec:
  podSelector:
    matchLabels:
      app: bitvault-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
