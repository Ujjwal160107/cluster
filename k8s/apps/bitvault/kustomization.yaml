apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bitvault
resources:
  - networkpolicy.yaml
  - postgres.yaml
  - minio.yaml
  - bitvaultd.yaml
  - ingress.yaml
components:
  # CLUSTER-001: shared namespace + PSA labels; the per-app namespace.yaml this replaces was
  # byte-identical apart from its `name:`, which the kustomization's `namespace:` now supplies.
  - ../../components/namespace-baseline

generators:
  # SOPS-encrypted via ksops (kind: ksops) -- see secrets.sops.yaml
  - secret-generator.yaml
images:
  # CI (upayanmazumder/bitvault .github/workflows/main.yml) publishes
  # `edge` (floating, main branch) and `sha-<short>` — never `latest`.
  #
  # Pinned to a digest instead of `newTag: edge`: ghcr pulls for this private
  # package started returning 403 (pull token revoked/expired, S13 finding),
  # so any pod (re)scheduled after the last successful pull crash-loops
  # forever trying to re-pull `edge`. This exact digest is already cached on
  # the node from before the token broke, so imagePullPolicy: IfNotPresent
  # (bitvaultd.yaml) uses it with zero network pulls. argocd-image-updater
  # (.argocd/image-updater.yaml) also can't reach the registry right now —
  # it'll resume normal automatic digest updates once a working ghcr
  # credential exists (S5 rotation); until then this stays fixed here.
  - name: ghcr.io/upayanmazumder/bitvault/bitvaultd
    digest: sha256:79cd714b7decab7c75166194cc62b86417b035aaab219ff54c0df649c118eb3b
