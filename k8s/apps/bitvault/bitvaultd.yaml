apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitvaultd
  namespace: bitvault
  labels:
    app: bitvaultd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bitvaultd
  template:
    metadata:
      labels:
        app: bitvaultd
    spec:
      priorityClassName: low-priority
      imagePullSecrets:
        - name: bitvault-ghcr-pull
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - vps
      initContainers:
        # bitvaultd's runtime image is distroless (no shell), so the TCP
        # wait for Postgres runs in a tiny busybox sidecar step first.
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z bitvault-postgres 5432; do echo waiting for postgres; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        # Forward-only schema migrations (services/bitvaultd/main.go
        # `migrate` subcommand) — idempotent, safe to run on every rollout.
        - name: migrate
          image: ghcr.io/upayanmazumder/bitvault/bitvaultd:latest
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - secretRef:
                name: bitvaultd-env
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: bitvaultd
          image: ghcr.io/upayanmazumder/bitvault/bitvaultd:latest
          # Was `Always` -- ghcr pulls for this private package return 403
          # (S13 finding), so `Always` meant every pod (re)start crash-looped
          # trying to re-pull even though the exact pinned digest (see
          # kustomization.yaml) is already cached on the node.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9091
          envFrom:
            - secretRef:
                name: bitvaultd-env
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: bitvaultd
  namespace: bitvault
spec:
  selector:
    app: bitvaultd
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
    - name: metrics
      port: 9091
      targetPort: 9091
