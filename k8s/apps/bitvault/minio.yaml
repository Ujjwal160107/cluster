apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  name: bitvault-minio-pvc
  namespace: bitvault
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitvault-minio
  namespace: bitvault
  labels:
    app: bitvault-minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bitvault-minio
  template:
    metadata:
      labels:
        app: bitvault-minio
    spec:
      priorityClassName: low-priority
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - vps
      containers:
        - name: minio
          # quay.io/minio/minio:latest returns 401 (upstream registry no longer serves
          # public pulls of this tag, S0 finding) -- pinned to the digest already
          # cached on the node from before the registry change, so no network pull is
          # ever needed. imagePullPolicy explicit so a future node/pod reschedule
          # can't accidentally try (and fail) to re-pull. See changelog/2026-09.md.
          image: ghcr.io/upayanmazumder/mirror/minio:RELEASE.2025-04-22T22-12-26Z
          imagePullPolicy: IfNotPresent   # the mirror is pullable now; the cached-digest pin is no longer needed
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          envFrom:
            - secretRef:
                name: bitvault-minio-env
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bitvault-minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bitvault-minio
  namespace: bitvault
spec:
  selector:
    app: bitvault-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
