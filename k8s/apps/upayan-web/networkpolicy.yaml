# S11 hardening: default-deny ingress. The only Ingress in this namespace
# routes api.upayan.dev to the `upayan-api` Service on 4000, so Traefik is
# the only legitimate source.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upayan-web-default-deny-ingress
  namespace: upayan-web
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upayan-web-ingress
  namespace: upayan-web
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4000
