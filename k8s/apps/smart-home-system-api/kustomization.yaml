apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smart-home-system-api
resources:
  - deployments.yaml
  - services.yaml
  - httpscaledobject.yaml
  - networkpolicy.yaml
  - persistentvolumeclaim.yaml
components:
  # CLUSTER-001: shared namespace + PSA labels; the per-app namespace.yaml this replaces was
  # byte-identical apart from its `name:`, which the kustomization's `namespace:` now supplies.
  - ../../components/namespace-baseline

generators:
  # SOPS-encrypted via ksops (kind: ksops) -- see secrets.sops.yaml
  - secret-generator.yaml
images:
  - name: ghcr.io/upayanmazumder/smart-home-system/api
    newTag: latest
