# S11 hardening: default-deny ingress, then allow only Traefik (public
# traffic for react.dj.upayan.dev / api.react.dj.upayan.dev) and pods in this
# namespace. Frontend (3000) and backend (5000) share one pod here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: learning-react-default-deny-ingress
  namespace: learning-react
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: learning-react-ingress
  namespace: learning-react
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 5000
