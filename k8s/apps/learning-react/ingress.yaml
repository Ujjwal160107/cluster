apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learning-react-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  # No `tls:` block: Traefik serves the *.upayan.dev default certificate (TLSStore `default` in
  # kube-system, Cloudflare Origin CA) — see docs/adr/0004-origin-ca-tlsstore.md.
  rules:
  - host: react.dj.upayan.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: learning-react-frontend
            port:
              number: 3000
  - host: api.react.dj.upayan.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: learning-react-backend
            port:
              number: 5000
