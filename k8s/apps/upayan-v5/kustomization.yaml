apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: upayan-v5
resources:
  - httpscaledobject-app.yaml
  - httpscaledobject-api.yaml
  - networkpolicy.yaml
  - api/deployment.yaml
  - api/service.yaml
  - app/deployment.yaml
  - app/service.yaml
components:
  # CLUSTER-001: shared namespace + PSA labels; the per-app namespace.yaml this replaces was
  # byte-identical apart from its `name:`, which the kustomization's `namespace:` now supplies.
  - ../../components/namespace-baseline

generators:
  # SOPS-encrypted via ksops (kind: ksops) -- see secrets.sops.yaml
  - secret-generator.yaml
images:
  - name: ghcr.io/upayanmazumder/upayan.dev/app
    newTag: v5
  - name: ghcr.io/upayanmazumder/upayan.dev/api
    newTag: v5
