# S11 hardening: default-deny ingress for the namespace, then allow only
# Traefik (public traffic for bandit.upayan.dev / api-bandit.upayan.dev) and
# pods in this namespace. Frontend (3000) and backend (5000) share one pod
# here, so the same-namespace rule is belt-and-braces rather than required.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bandit-default-deny-ingress
  namespace: bandit
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bandit-ingress
  namespace: bandit
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 5000
