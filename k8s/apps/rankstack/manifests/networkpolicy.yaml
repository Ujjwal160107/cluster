# S11 hardening. The rankstack chart (upayanmazumder/rankstack, k8s/chart/)
# has no NetworkPolicy templates, and this directory is excluded from the
# `apps` ApplicationSet (it holds only the Helm values overlay), so these
# live here and are applied by a third source on the explicit `de-rankstack`
# Application.
#
#   api (8000)   <- Traefik (api-rankstack.upayan.dev) + same namespace
#   mongo (27017) <- same namespace only (also covers the mongo-rs-init Job)
#   redis (6379) <- same namespace only
#
# Mongo and Redis are unauthenticated (see values/prod.yaml) and ClusterIP
# only -- same-namespace-only is what keeps that acceptable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rankstack-default-deny-ingress
  namespace: rankstack
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rankstack-api-ingress
  namespace: rankstack
spec:
  podSelector:
    matchLabels:
      app: rankstack-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rankstack-mongo-ingress
  namespace: rankstack
spec:
  podSelector:
    matchLabels:
      app: rankstack-mongo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 27017
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rankstack-redis-ingress
  namespace: rankstack
spec:
  podSelector:
    matchLabels:
      app: rankstack-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 6379
