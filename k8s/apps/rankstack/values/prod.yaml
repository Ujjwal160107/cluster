# Real per-cluster values, layered over upayanmazumder/rankstack's
# k8s/chart/values.yaml defaults (chart repo has no secrets and no
# environment-specific config -- this file is that overlay, same split as
# k8s/apps/vcap/values/backend-staging.yaml).
#
# Nothing here is actually secret today (Mongo/Redis are unauthenticated,
# ClusterIP-only, matching the app's own docker-compose.yml) -- kept in this
# private repo anyway, not the (public) rankstack repo, so real credentials
# can be dropped in later with zero template change.
env:
  CORS_ORIGINS: "https://rankstack.upayan.dev"
