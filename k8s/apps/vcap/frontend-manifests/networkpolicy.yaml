# S11 hardening for the vcap frontend chart (VCAP-STAGING-FRONTEND,
# k8s/chart/), which has no NetworkPolicy templates. Applied by a third
# source on the explicit `vcap-frontend-staging` Application; kept in this
# repo rather than the frontend chart so all cluster network policy lives in
# the cluster's own source of truth.
#
# The frontend web pod serves vcap.upayan.dev and is reached only through
# Traefik. It talks outward to vcap-backend-staging-api / -auth by in-cluster
# Service name (values/frontend-staging.yaml apiSvcHost/authSvcHost) -- that
# is egress, which these ingress-only policies do not restrict.
#
# No namespace-wide default-deny is added here: this namespace also holds the
# backend chart's pods, and its Postgres is still deliberately reachable from
# outside via NodePort 30532 (see docs/storage.md and the S6 notes). A blanket
# deny written from this repo would break that. The backend chart's own
# policies (api/auth/redis/minio) cover those pods instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vcap-frontend-web-ingress
  namespace: vcap-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vcap-frontend
      app.kubernetes.io/instance: vcap-frontend-staging
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
