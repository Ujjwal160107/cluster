# The VCAP Secrets for the dev environment, moved out of the values files (SEC-003).
#
# Why a separate source instead of one file per Application: the VCAP Applications are
# Helm-sourced from a git chart, and kustomize --enable-helm cannot consume that chart
# while also running a ksops generator (docs/runbooks/rotate-secrets.md documents the
# blocker). ArgoCD multi-source is the supported way around it, and this repo already
# uses that shape for the frontend manifests.
#
# Secret names are unchanged -- backend-env, auth-env and pull-secret are what
# .Values.existingSecrets names, so ArgoCD sees the same desired objects, the same
# Application owns them, and nothing is pruned.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# SOPS-encrypted via ksops (kind: ksops) -- see secrets.sops.yaml
generators:
  - secret-generator.yaml
