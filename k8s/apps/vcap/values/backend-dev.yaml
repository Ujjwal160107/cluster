# ── VCAP Backend — Development ────────────────────────────────────────────────
# Chart: VCAP-STAGING-BACKEND k8s/chart (vcap-backend)
# Namespace: vcap-dev  |  Cluster: Hetzner k3s
# Frontend runs locally (pnpm dev); only backend services deployed here.
# Ingress: fihh.upayan.dev (single-host path routing)
#
# Local frontend .env:
#   BACKEND_BASE_URL=https://fihh.upayan.dev
#   AUTH_SERVICE_BASE_URL=https://fihh.upayan.dev
#   APP_ORIGIN=http://localhost:3000
# ─────────────────────────────────────────────────────────────────────────────


# appOrigin drives FRONTEND_BASE_URL + GOOGLE_REDIRECT_URI in auth configmap.

web:
  config:
    appOrigin: https://fihh.upayan.dev

dev:
  singleHostRouting: true

hosts:
  api: fihh.upayan.dev
  web: ""

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  tls:
    mode: traefik-default

api:
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 384Mi

auth:
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 128Mi

worker:
  enabled: true
  keda:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 1
  resources:
    requests:
      cpu: 75m
      memory: 192Mi
    limits:
      cpu: 400m
      memory: 768Mi

postgres:
  enabled: true
  # P2-08 (2026-09-29): the network login policy, installed by the chart as a pg_hba.conf.
  #
  # `restricted` = only `vcap_app` and `vcap_people` may log in over TCP, with a password;
  # every other network login is rejected, **the bootstrap superuser's included**. `local`
  # (the container socket) stays trusted, which is how operators reach it with
  # `kubectl exec … psql` — no network hole is needed for that.
  #
  # Enabled only after the application moved onto `vcap_app` and had been observed running
  # there (2 connections, both services ready) — the order matters, because enabling this
  # while the app still authenticated as the superuser would have cut it off.
  #
  # The installed file lives in the data directory, so `off` would NOT revert it; `default`
  # is the explicit revert state (see the chart's values.yaml).
  pgHba:
    mode: "restricted"
    # `+vcap_people` is pg_hba's *membership* prefix: without it the rule names a role that no
    # person logs in as (the group is NOLOGIN), so every per-person role fell through to the final
    # `reject` — measured: `FATAL: pg_hba.conf rejects connection for host "…", user "upayan"`.
    # The application role needs no prefix; it logs in as itself.
    appRoles: ["vcap_app", "+vcap_people"]
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 192Mi
redis:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 40m
      memory: 64Mi

storage:
  backend: local
  singleVolume: true
  dataPvcSize: 10Gi
  # S8: data lives on the vps-data volume via a manually-provisioned static PV
  # (vcap-backend-dev-data-vps), not the hcloud-volumes CSI. Empty string
  # forces the PVC to bind statically instead of dynamic-provisioning a new
  # CSI volume — see docs/storage.md and changelog/2026-09.md.
  storageClassName: ""
  s3:
    # In-cluster MinIO (chart component) — report uploads/artifacts route here;
    # daily logs stay on the local artifacts PVC.
    endpoint: http://vcap-backend-dev-minio:9000
    minio:
      enabled: true
      # Pulled from our own mirror, not `quay.io/minio/minio` — upstream 401s that tag, so until
      # 2026-09-28 this component ran only from the node's containerd cache (an image GC or a rebuild
      # meant MinIO could not start). The mirror is pushed and verified; keep it in sync with
      # docs/backups.md if this value ever moves.
      image: ghcr.io/upayanmazumder/mirror/minio:RELEASE.2025-04-22T22-12-26Z
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 150m
          memory: 384Mi

nodeAffinity:
  enabled: true
  hostname: vps

seed:
  enabled: true
sheetsSync:
  enabled: false

pdb:
  enabled: false
networkPolicy:
  enabled: true

config:
  app:
    env: development
  auth:
    mailDomains:
      student: "*"
      faculty: "*"
      coordinator: "*"
      hod: "*"
      admin: "*"

# ── Secrets ───────────────────────────────────────────────────────────────────
# SEC-003 (2026-09-29): the values are **no longer here**. They live SOPS-encrypted in
# k8s/apps/vcap/secrets/{dev,staging}/secrets.sops.yaml, which this Application sources as a second
# (kustomize + ksops) source. `create: false` stops the chart rendering the two Secrets at all.
#
# What made this safe to delete rather than move-by-copy: no template reads `.Values.secrets.*`
# except `secret.yaml` itself — every consumer (postgres, api, worker, auth, minio, watchdog) uses
# a `secretKeyRef` against `existingSecrets`. And every value here was hash-verified identical to the
# live Secret before the move, so no consumer sees a different byte.
secrets:
  create: false
# The Secret names the workloads reference. Unchanged — these are what the live Secrets have always
# been called — but stated explicitly now, because they are the entire interface between the chart
# and the SOPS-provided Secrets: leaving them to the chart's defaults would put the coupling in a
# repository this one does not review.
existingSecrets:
  backend: backend-env
  auth: auth-env
  imagePull: pull-secret
