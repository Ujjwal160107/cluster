# ── VCAP Frontend — Staging ───────────────────────────────────────────────────
# Chart: VCAP-STAGING-FRONTEND k8s/chart (vcap-frontend)
# Namespace: vcap-staging  |  Cluster: Hetzner k3s
# Ingress: vcap.upayan.dev → web (TLS via Traefik TLSStore/default)
# ─────────────────────────────────────────────────────────────────────────────


web:
  enabled: true
  config:
    appOrigin: https://vcap.upayan.dev
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

hosts:
  web: vcap.upayan.dev

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  tls:
    mode: traefik-default

# Backend service names as deployed by the vcap-backend-staging ArgoCD app.
# These are the ClusterIP services the frontend pod proxies through.
backend:
  apiSvcHost: vcap-backend-staging-api
  authSvcHost: vcap-backend-staging-auth
  apiPort: 8000
  authPort: 8080

nodeAffinity:
  enabled: true
  hostname: vps

existingSecrets:
  imagePull: pull-secret
