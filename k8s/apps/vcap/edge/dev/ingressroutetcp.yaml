# Cluster-owned documentation of the live object: the public Postgres edge for
# vcap-dev. It existed only in the cluster (created 2026-07-26 by hand) until
# 2026-09-29, so a rebuild from git could not have reproduced it and nothing
# reviewed a change to it.
#
# Behaviour is deliberately unchanged here: same entrypoint (`postgres-dev`),
# same `HostSNI("*")` route, same service. The port and TLS changes are a
# separate, gated step (P7-N7) because they change what the internet can reach.
#
# `Prune=false`: this file being removed from git must never silently close or
# delete the edge — that is a routing change, and it belongs in a reviewed
# commit with an intent comment, not in a prune sweep.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: vcap-postgres-dev
  namespace: vcap-dev
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  entryPoints:
    - postgres-dev
  routes:
    - match: HostSNI("*")
      services:
        - name: vcap-backend-dev-postgres
          port: 5432
