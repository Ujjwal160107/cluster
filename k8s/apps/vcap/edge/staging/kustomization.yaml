apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vcap-staging
resources:
  - ingressroutetcp.yaml
  - networkpolicy.yaml
  - tlsoption.yaml
# N7: the edge's TLS material, SOPS-encrypted via ksops (see secrets.sops.yaml). It is in this
# directory rather than the tenant's Secret set because it belongs to the edge, not the app: the
# CA is the cluster's, and the leaf is a cluster-side control.
generators:
  - secret-generator.yaml
