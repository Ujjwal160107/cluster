# Cluster-owned documentation of the live object: the public Postgres edge for
# vcap-staging. It existed only in the cluster (created 2026-07-26 by hand) until
# 2026-09-29, so a rebuild from git could not have reproduced it and nothing
# reviewed a change to it.
#
# N7 (2026-09-29): the entrypoint moves to `vcap-pg-staging` (:15432/:15433 for dev/staging) and TLS
# is added. **The listener is not reachable from the internet** until the firewall gains a rule for
# it, which waits on P2-08 + VCAP's acceptance.
#
# Why `HostSNI` names a hostname rather than `*`, and why that is the whole TLS design:
# a client connecting *by IP* sends no SNI, and Traefik then serves its **default** certificate —
# which is the cluster's `*.upayan.dev` wildcard and cannot validate against this edge's private CA.
# The plan measured that failure mode and worked around it by making the Postgres leaf the
# entrypoint's default certificate, which would mean a namespace-level `TLSStore` in `vcap-staging` —
# and that would break this tenant's *web* certificates, because their Ingresses carry no `tls:` block
# and therefore fall back to the same default (measured: `kube-system/default` → the wildcard).
# Naming the SNI instead lets Traefik select this route's own certificate from `tls.secretName`, with
# no default certificate changed and no new namespace: clients pass `host=pg-staging.upayan.dev` (for SNI and
# certificate verification) together with `hostaddr=138.201.157.147` (to connect by IP). See
# `docs/runbooks/vcap-postgres-access.md`.
#
# `Prune=false`: this file being removed from git must never silently close or
# delete the edge — that is a routing change, and it belongs in a reviewed
# commit with an intent comment, not in a prune sweep.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: vcap-postgres-staging
  namespace: vcap-staging
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  entryPoints:
    - vcap-pg-staging
  routes:
    - match: HostSNI(`pg-staging.upayan.dev`)
      services:
        - name: vcap-backend-staging-postgres
          port: 5432
  tls:
    # Leaf signed by the cluster's private Postgres edge CA; the CA certificate is public and in the
    # runbook. Traefik selects it because the SAN matches the SNI above.
    secretName: vcap-postgres-edge-tls
