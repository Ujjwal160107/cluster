# N7: the ALPN protocol name libpq 17+ offers, which Traefik's TCP router otherwise refuses.
#
# Measured 2026-09-29, through the public edge:
#   openssl s_client … -servername pg-dev.upayan.dev -alpn postgresql
#     -> "tlsv1 alert no application protocol" (alert 120), handshake fails
#   the same command with no -alpn
#     -> subject=CN=pg-dev.upayan.dev, Verify return code: 0 (ok)
# So Traefik terminates TLS and forwards bytes, but negotiates no application protocol, and
# Go's TLS server answers alert 120 whenever a client offers one it cannot match. libpq has
# sent ALPN "postgresql" since PostgreSQL 17 — which is why the plan's own TLS experiment
# passed: it used psql 16, which offers none, and the failure only appears with a modern
# client (reproduced with psql 18.6). `sslnegotiation=direct` did not suppress the offer.
#
# This is not a workaround for a misconfiguration: TLS ALPN is how a Postgres client says
# "I am speaking the postgres protocol", so the edge has to agree to it.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: vcap-pg
  namespace: vcap-staging
spec:
  alpnProtocols:
    - postgresql
  minVersion: VersionTLS12
