# N7: the VCAP Postgres edge TLS material for staging.
#
# The leaf is signed by the cluster's private Postgres edge CA. Its SANs are
# `pg-staging.upayan.dev` **and** `IP:138.201.157.147`: the name is what the client puts in `host=`
# (so libpq sends it as SNI, which is how Traefik selects this certificate) and the IP is what it
# puts in `hostaddr=` (so no DNS record is needed, and no click-ops record has to be created
# against the rule that forbids hand-written ones in terraform/).
#
# `tls.crt` carries the leaf **and** the CA, so a client that has only the CA file still verifies.
# The CA certificate is public and lives in docs/runbooks/vcap-postgres-access.md; the CA **key**
# is not here and never will be — it is what signs a replacement leaf.
#
# Rotation: `docs/runbooks/rotate-certificates.md`, leaf validity to 2028-09-28, CA to 2036-09-26.
