# N7: the one thing the tenant's own Postgres NetworkPolicy cannot express — an ingress from the
# ingress controller. Their policy admits same-namespace pods only (correct for everything except
# this deliberate edge), and NetworkPolicies are **additive**, so this one unions with theirs rather
# than replacing it. Nothing else gains access.
#
# Deliberately narrow: `kube-system` + the Traefik pod label + tcp/5432 on the Postgres pods of
# exactly this release.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vcap-postgres-edge
  namespace: vcap-staging
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: vcap-backend-staging
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 5432
