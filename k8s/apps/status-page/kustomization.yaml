apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: status-page
resources:
  - networkpolicy.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/ingress.yaml
  - app/deployments.yaml
  - app/service.yaml
components:
  # CLUSTER-001: shared namespace + PSA labels; the per-app namespace.yaml this replaces was
  # byte-identical apart from its `name:`, which the kustomization's `namespace:` now supplies.
  - ../../components/namespace-baseline

generators:
  # SOPS-encrypted via ksops (kind: ksops) -- see secrets.sops.yaml
  - secret-generator.yaml
images:
  - name: ghcr.io/upayanmazumder/status-page/api
    newTag: latest
  - name: ghcr.io/upayanmazumder/status-page/app
    newTag: latest
