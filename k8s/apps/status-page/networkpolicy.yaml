# S11 hardening: default-deny ingress, then allow Traefik on the two Ingress
# backends (status-page.upayan.dev -> status-page-app:3000,
# api-status-page.upayan.dev -> status-page-api:5000) plus same-namespace
# traffic (the app may call the api Service directly).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: status-page-default-deny-ingress
  namespace: status-page
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: status-page-app-ingress
  namespace: status-page
spec:
  podSelector:
    matchLabels:
      app: status-page-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: status-page-api-ingress
  namespace: status-page
spec:
  podSelector:
    matchLabels:
      app: status-page-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5000
