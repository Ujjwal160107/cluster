apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: learning-docker
resources:
  - deployments.yaml
  - services.yaml
  - httpscaledobject.yaml
  - networkpolicy.yaml
images:
  - name: ghcr.io/upayanmazumder/learning-docker
    newTag: latest

components:
  # CLUSTER-001: shared namespace + PSA labels; the per-app namespace.yaml this replaces was
  # byte-identical apart from its `name:`, which the kustomization's `namespace:` now supplies.
  - ../../components/namespace-baseline
