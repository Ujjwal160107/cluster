- port: 5432
  proto: tcp
  service: vcap-dev postgres (legacy public path)
  k8s_service: traefik postgres-dev IngressRouteTCP (k8s/apps/vcap/edge/dev)
  namespace: vcap-dev
  owner: upayan (app owner), vcap devs (consumers)
  scope: public
  status: closed
  reason: "**Closed.** The unmanaged NodePort duplicate was deleted 2026-09-29 (P1-05) and the tenant chart's own same-namespace NetworkPolicy (2026-09-28) blocks the Traefik path, so this port serves nothing today. It is not the target port and must not reopen — the public path is the one below."
  firewall_rule: none today (no 5432 rule is intended)
  ingress: "traefik postgres-dev TCP entrypoint"
  auth: "scram, app superuser only — not an acceptable state to expose"
  temporary: false
  expires: "never reopens; superseded by 15432"


- port: 15432
  proto: tcp
  service: vcap-dev postgres (target public path)
  k8s_service: vcap-backend-dev-postgres:5432, behind Traefik with TLS termination
  namespace: vcap-dev
  owner: upayan (app owner), vcap devs (consumers)
  scope: public — **NOT OPEN YET**
  status: not-open
  reason: "Owner decision OD-1: the public path is 15432, not 5432 — a non-default port is defence against mass scanning, not a security control on its own. It stays closed until ALL of: TLS at Traefik with a private-CA leaf (sslmode=verify-ca), a non-superuser vcap_app role, pg_hba that rejects network superuser logins, per-person non-superuser roles, the cluster-owned additive ingress NetworkPolicy, and auth-failure alerting — AND the VCAP team accepts the chart-side pg_hba/role change (OD-16). Today both instances are ssl=off and the only login role is a superuser."
  firewall_rule: "target (P7-N7): tcp 15432 from 0.0.0.0/0 and ::/0 — NO such rule exists today"
  ingress: "Traefik vcap-pg-dev entrypoint (P7-N7) -> IngressRouteTCP with tls.secretName"
  auth: "TLS required (sslmode=verify-ca) + scram, per-person non-superuser roles"
  temporary: false
  expires: null


