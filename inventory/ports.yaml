# Port registry for the `vps` cluster (Hetzner DE, 138.201.157.147).
#
# Source of truth for every port that is (or was, or will be) reachable from outside the pod
# network. Cross-checked by `scripts/check-ports.py`, which fails CI if:
#   - two entries share the same (port, proto, scope), or
#   - a NodePort/LoadBalancer Service or hostPort in k8s/ has no matching entry here.
#
# `status` values:
#   live    — reachable today, matches current-state review (docs/plans/2026-09-27-architecture-review.md §4)
#   target  — reachable in the S6-final firewall state, not yet applied
#   remove  — reachable today, scheduled for removal (duplicate/unmanaged path)
#
# `scope`: internal (pod/cluster network only) | tailnet (Tailscale-only) | public (open internet)
#
# Last verified live: 2026-09-27 (ss -Hltnp on the node + external TCP probe from workstation).
# See docs/ports.md for the human-readable render and docs/networking.md for the firewall layers.

