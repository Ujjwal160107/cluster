[defaults]
inventory = inventory.yaml
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
# community.sops' vars plugin decrypts group_vars/vps/secrets.sops.yaml in-flight, so no plaintext
# secret ever reaches the host or this repo. The key is the owner's offline age key
# (or SOPS_AGE_KEY_FILE) on the control machine.
vars_plugins_enabled = host_group_vars,community.sops.sops
roles_path = roles

[privilege_escalation]
become = False
