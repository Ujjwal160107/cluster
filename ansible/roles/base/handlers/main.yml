---
- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Restart atop
  ansible.builtin.systemd:
    name: atop
    state: restarted

- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Nothing to restart
  ansible.builtin.debug:
    msg: "config file edited, no daemon restart needed (read on next unattended-upgrade run)"
